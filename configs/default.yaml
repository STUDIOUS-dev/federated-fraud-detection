project: federated_fraud_detection

data:
  seed: 42
  n_customers_per_bank: 500
  transactions_per_customer: 40
  test_fraction: 0.20
  heterogeneity: "default" # Can be 'iid', 'default', or 'extreme'

model:
  hidden_dim: 32
  dropout: 0.10
  lr: 0.001

training:
  local_epochs: 2
  batch_size: 256

federated:
  clients: 4
  rounds: 5
  aggregation: "FedAvg"
  fedprox_mu: 0.01
  fraction_fit: 1.0
  # Phase E (off by default; see docs/PHASE_E_RESULTS.md)
  clip_norm: 0.0            # L2 bound on each client update, 0 = off
  dp_noise_multiplier: 0.0  # client-level DP noise (needs clip_norm > 0 and FedAvg/FedProx)
  dp_delta: 1.0e-5

evaluation:
  primary_metrics:
    - pr_auc
    - f1
    - recall
    - precision
  global_eval: true
  per_client_eval: true

privacy_note: raw_data_stays_local; optional_client_level_dp (off by default); no_secure_aggregation

project: federated_fraud_detection

data:
  seed: 42
  n_customers_per_bank: 500
  transactions_per_customer: 40
  test_fraction: 0.20
  heterogeneity: "default" # Can be 'iid', 'default', or 'extreme'

model:
  hidden_dim: 32
  dropout: 0.10
  lr: 0.001

training:
  local_epochs: 2
  batch_size: 256

federated:
  clients: 4
  rounds: 5
  aggregation: "FedAvg"
  fedprox_mu: 0.01
  fraction_fit: 1.0

evaluation:
  primary_metrics:
    - pr_auc
    - f1
    - recall
    - precision
  global_eval: true
  per_client_eval: true

privacy_note: raw_data_stays_local; no_dp_or_secure_aggregation
